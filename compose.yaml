services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: koop-state
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - ./storage/postgres:/var/lib/postgresql
  feedback:
    container_name: koop-state
    image: ghcr.io/jesperrichert/koop-feedback:latest
    depends_on:
      - postgres
    ports:
      - "4000:3000"
    env_file:
      - .env